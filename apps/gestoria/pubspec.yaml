name: gestoria_os
description: Portal Gestoría — carpeta digital según las dos hojas impresas.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.2.4
  easy_localization: ^3.0.7
  file_picker: ^8.3.7
  url_launcher: ^6.3.2
  gestoria_auth:
    path: ../../packages/gestoria_auth
  supabase_flutter: ^2.9.1
  web: ^1.1.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/branding/
