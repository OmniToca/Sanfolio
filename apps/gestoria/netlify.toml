# Flutter web SPA. Build spouští root `tool/netlify_flutter_build.sh`.
# Když je Base directory v UI `apps/gestoria`, tento soubor se použije sám.

[build]
  command = "bash ../../tool/netlify_flutter_build.sh apps/gestoria"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
