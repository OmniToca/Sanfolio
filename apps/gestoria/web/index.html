<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SanFolio — gestión y asistencia for Spanish gestoría.">
  <meta name="theme-color" content="#12201E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SanFolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SanFolio | Gestoría</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Recovery token musí zůstat v query/hash. Flutter hash router ho jinak
    spolkne a GoTrue skončí na cizí cestě (u nás `/sb` = 404).
  -->
  <script>
    (function () {
      var path = location.pathname;
      var search = location.search;
      var hash = location.hash || '';
      var blob = search + hash;
      var recovery = /type=recovery/.test(blob) ||
        /access_token=/.test(blob) ||
        (/[?&]code=/.test(search) && !/[?&]session_id=/.test(search));
      if (recovery && path !== '/reset-password') {
        location.replace('/reset-password' + search + hash);
        return;
      }
      if (hash.indexOf('#/') === 0 && hash.indexOf('access_token') === -1) {
        location.replace(hash.slice(1) + search);
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
